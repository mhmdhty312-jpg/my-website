
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>موقعي الإلكتروني</title>
  <style>
    body {
      background: #101827;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px 15px;
    }
    .card {
      background: #1f2d42;
      padding: 30px 15px;
      border-radius: 20px;
      max-width: 400px;
      margin: auto;
    }
    h1 { color: #54e6a5; }
    button {
      background: #54e6a5;
      border: none;
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>أهلًا، أنا فاضي!</h1>
    <p>مرحبًا بك في موقعي الإلكتروني.</p>
    <button onclick="alert('أهلًا بك في موقعي!')">
      اضغط هنا
    </button>
  </div>
</body>
</html>
